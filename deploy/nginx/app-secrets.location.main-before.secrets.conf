location ~ ^/(?!\.well-known/) {
    proxy_pass http://127.0.0.1:5100;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # L'adresse du visiteur est celle que nginx voit, jamais celle qu'il annonce :
    # Forwarded et Client-IP retirés, X-Forwarded-For remplacé (aucun proxy devant nginx).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Client-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    client_max_body_size 50M;
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' '<script nonce="$cw_nonce" src="/cw-custom.js"></script></body>';
}
